<!doctype html>
<html>
<head>
    <title>textsabre: radial pixel editor for POV displays</title>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />        
    <link rel="stylesheet" type="text/css" href="editor.css" />
    <script src="snap.svg-min.js"></script>
    <script src="cycle.js"></script>
    <script src="split.js"></script>
    <script src="font-spleen-5x8.js"></script>
    <script src="font-spleen-6x12.js"></script>
    <script src="font-spleen-8x16.js"></script>
    <script src="font-spleen-12x24.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
    <div class="content">
        <div class="overlay overlay-left" id="tip_left"></div>
        <div class="overlay overlay-right" id="tip_right">
            <select id="image_index" title="Switch image slots with Alt+1 through Alt+8">
                <option value="0" selected>image_0</option>
                <option value="1">image_1</option>
                <option value="2">image_2</option>
                <option value="3">image_3</option>
                <option value="4">image_4</option>
                <option value="5">image_5</option>
                <option value="6">image_6</option>
                <option value="7">image_7</option>
            </select>
            <button id="load">load</button>
            <button id="save">save</button>
            <button id="new">clear</button>
            <span id="arduino-code">arduino code</span>
            <button id="clear_all">reset all</button>
            <button id="copy">&#10697; copy image</button>
            <button id="copy_all">&#10697; copy all</button>
            <button id="expand" title="Show/Hide Arduino Code">&#9660;</button>
            <textarea readonly id="output" class="collapsed"></textarea>
            <div id="fps_warning" class="hidden">Slow rotation speed. Check your browser's hardware acceleration settings. <span id='close_fps_warning'>[X]</span></div>
        </div>
        <svg id="svg" class="noselect"></svg>
        <div class="toolbar">
            <div class="toolbar-row toolbar-row-primary">
                <div class="toolbar-group group-rotate">
                    <split-button
                        id="rotate-btn"
                        class="hint-rotate"
                        split="forward"
                        left-label="A"
                        right-label="D"
                        left-value="left"
                        right-value="right"
                        left-title="Rotate counter-clockwise (A or Left Arrow)"
                        right-title="Rotate clockwise (D or Right Arrow)"
                        label="rotate">
                    </split-button>
                    <split-button
                        id="view-btn"
                        class="hint-view"
                        split="none"
                        left-label="V"
                        left-value="view"
                        left-title="Toggle view (V)"
                        label="view"
                        selected>
                    </split-button>
                </div>

                <div class="hint hint-color toolbar-group group-color">
                    <span class="group-label">color</span>
                    <div class="color-keys">
                        <kbd class="key kbd pressable active color0">1</kbd>
                        <kbd class="key kbd pressable active color1">2</kbd>
                        <kbd class="key kbd pressable active color2">3</kbd>
                        <kbd class="key kbd pressable active color3">4</kbd>
                        <kbd class="key kbd pressable active color4">5</kbd>
                        <kbd class="key kbd pressable active color5">6</kbd>
                        <kbd class="key kbd pressable active color6">7</kbd>
                        <kbd class="key kbd pressable active color7" style="display:none">8</kbd>
                        <kbd class="key kbd pressable active color8" style="display:none">9</kbd>
                        <kbd class="key kbd pressable active color9" style="display:none">0</kbd>
                    </div>
                </div>

                <div class="toolbar-group group-actions">
                    <split-button
                        id="history-btn"
                        class="hint-history"
                        split="vertical"
                        left-value="undo"
                        right-value="redo"
                        left-title="Undo (Ctrl+Z)"
                        right-title="Redo (Ctrl+Y or Ctrl+Shift+Z)"
                        left-disabled
                        right-disabled
                        label="history">
                        <span slot="left" class="shortcut"><span class="ctrl">Ctrl</span><span>Z</span></span>
                        <span slot="right" class="shortcut"><span class="ctrl">Ctrl</span><span>Y</span></span>
                    </split-button>

                    <split-button
                        id="clipboard-btn"
                        class="hint-clipboard"
                        split="vertical"
                        left-value="copy"
                        right-value="paste"
                        left-title="Copy the current pixel image (Ctrl+C)"
                        right-title="Paste a TextSabre pixel image (Ctrl+V)"
                        label="copy / paste">
                        <span slot="left" class="shortcut"><span class="ctrl">Ctrl</span><span>C</span></span>
                        <span slot="right" class="shortcut"><span class="ctrl">Ctrl</span><span>V</span></span>
                    </split-button>
                </div>
            </div>

            <div class="toolbar-row toolbar-row-tools">
                <div class="hint hint-tools toolbar-group group-tools">
                    <span class="group-label">tool</span>
                    <cycle-button 
                        id="pixel-btn"
                        class="pressable active tool-draw"
                        config='[{"id":"weight","side":"right","count":3,"layout":"3x1","order":"column","title":"Stroke Width: Light"}]'>
                        <span class="hotkey">P</span>ixel
                    </cycle-button>
                    
                    <cycle-button
                        id="line-btn"
                        class="pressable active tool-line"
                        title="Draw line: press, drag, release"
                        config='[]'>
                        <span class="hotkey">L</span>ine
                    </cycle-button>
                    <cycle-button 
                        id="circle-btn"
                        class="pressable active tool-circle"
                        config='[{"id":"weight","side":"right","count":2,"layout":"2x1","order":"column","title":"Outline / Filled"}]'>
                        <span class="hotkey">C</span>ircle
                    </cycle-button>

                    <cycle-button 
                        id="text-btn"
                        class="pressable active tool-text"
                        config='[{"id":"orientation","side":"right","count":4,"layout":"2x2","order":"column","title":"Orientation"},{"id":"font-size","side":"right","count":4,"layout":"2x2","order":"column","title":"Font Size"}]'>
                        <span class="hotkey">T</span>ext
                    </cycle-button>

                    <div class="hint-write">
                        <input type="text" id="write" autocomplete="off" spellcheck="false" value="TEXTSABRE" />
                    </div>
                </div>

                <div class="erase-hint" title="Hold Shift while drawing to erase">
                    <kbd class="mini-key">Shift</kbd>
                    <span>hold to erase</span>
                </div>
            </div>
        </div>
    </div>

<script src="editor.js"></script>

</body>
</html>
